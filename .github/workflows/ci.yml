name: CI
on: [push, pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install platformio==6.1.19
      - name: Python and embedded web checks
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/build_web.py --check
      - name: Native unit tests
        run: pio test -e native
      - name: Build dev + prod + mock
        run: pio run -e nodemcuv2_dev -e nodemcuv2_prod -e nodemcuv2_mock
      - name: Static analysis
        run: pio check -e nodemcuv2_prod --skip-packages --severity low --fail-on-defect high
      - name: Firmware size gate (SPEC 146)
        run: |
          SIZE=$(stat -c%s .pio/build/nodemcuv2_prod/firmware.bin)
          echo "prod firmware: $SIZE bytes"
          # 4M2M layout: OTA staging = 2MB - sketch (plenty); the binding limit
          # is the linkable IROM region (~1019KB). Gate at 900KB for margin.
          test "$SIZE" -le 900000 || { echo "::error::firmware exceeds OTA budget"; exit 1; }
      - name: SHA-256
        run: sha256sum .pio/build/nodemcuv2_prod/firmware.bin
