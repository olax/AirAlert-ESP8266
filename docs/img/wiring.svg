<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .board{fill:#1b2531;stroke:#0e141c;stroke-width:2}
      .module{fill:#0f3057;stroke:#0a2140;stroke-width:2;rx:8}
      .pin{fill:#c9a227;stroke:#8a6d14;stroke-width:.6}
      .pinu{fill:#e8590c;stroke:#8a3608;stroke-width:.8}
      .pl{font-size:11px;fill:#cfd8e3}
      .plu{font-size:11px;font-weight:bold;fill:#ffb454}
      .ml{font-size:12px;fill:#e8eef5}
      .mlb{font-size:13px;font-weight:bold;fill:#ffffff}
      .w5v{stroke:#d62828;stroke-width:3;fill:none}
      .wgnd{stroke:#222831;stroke-width:3;fill:none}
      .wsig{stroke:#1d6fb8;stroke-width:3;fill:none}
      .wled{stroke:#e8590c;stroke-width:3;fill:none}
      .wfut{stroke:#8a94a3;stroke-width:2;fill:none;stroke-dasharray:6 5}
      .note{font-size:11.5px;fill:#4a5462}
      .cap{font-size:12px;font-weight:bold;fill:#2b333f}
      .warn{font-size:11.5px;font-weight:bold;fill:#b02a1a}
    </style>
  </defs>
  <rect width="920" height="620" fill="#f5f2ea"/>
  <text x="30" y="34" font-size="19" font-weight="bold" fill="#1b2531">AirAlert — схема підключення (сценарій A)</text>
  <text x="30" y="54" class="note">NodeMCU v3 LoLin · живлення платі — з USB · логіка 3.3 В</text>

  <!-- ==================== NodeMCU board ==================== -->
  <rect x="120" y="80" width="180" height="440" class="board" rx="10"/>
  <rect x="175" y="84" width="70" height="46" fill="#3a4656" rx="3"/>
  <text x="210" y="112" font-size="10" fill="#aab6c4" text-anchor="middle">ESP-12E</text>
  <rect x="185" y="486" width="50" height="28" fill="#5b6572" rx="2"/>
  <text x="210" y="504" font-size="9" fill="#e8eef5" text-anchor="middle">USB</text>
  <text x="210" y="146" font-size="12" fill="#e8eef5" text-anchor="middle" font-weight="bold">NodeMCU v3</text>

  <!-- left column pins (A0..VIN): labels inside the dark board -->
  <g>
    <rect x="108" y="158" width="12" height="9" class="pin"/><text x="128" y="166" class="pl">A0</text>
    <rect x="108" y="182" width="12" height="9" class="pin"/><text x="128" y="190" class="pl">RSV</text>
    <rect x="108" y="206" width="12" height="9" class="pinu"/><text x="128" y="214" class="plu">VU · 5V</text>
    <rect x="108" y="230" width="12" height="9" class="pin"/><text x="128" y="238" class="pl">S3</text>
    <rect x="108" y="254" width="12" height="9" class="pin"/><text x="128" y="262" class="pl">S2</text>
    <rect x="108" y="278" width="12" height="9" class="pin"/><text x="128" y="286" class="pl">S1</text>
    <rect x="108" y="302" width="12" height="9" class="pin"/><text x="128" y="310" class="pl">SC</text>
    <rect x="108" y="326" width="12" height="9" class="pin"/><text x="128" y="334" class="pl">S0</text>
    <rect x="108" y="350" width="12" height="9" class="pin"/><text x="128" y="358" class="pl">SK</text>
    <rect x="108" y="374" width="12" height="9" class="pin"/><text x="128" y="382" class="pl">GND</text>
    <rect x="108" y="398" width="12" height="9" class="pin"/><text x="128" y="406" class="pl">3V3</text>
    <rect x="108" y="422" width="12" height="9" class="pin"/><text x="128" y="430" class="pl">EN</text>
    <rect x="108" y="446" width="12" height="9" class="pin"/><text x="128" y="454" class="pl">RST</text>
    <rect x="108" y="470" width="12" height="9" class="pin"/><text x="128" y="478" class="pl">GND</text>
    <rect x="108" y="494" width="12" height="9" class="pin"/><text x="128" y="502" class="pl">VIN</text>
  </g>

  <!-- right column pins (D0..3V3): names inside the board, notes outside in dark -->
  <g>
    <rect x="300" y="158" width="12" height="9" class="pinu"/><text x="294" y="166" class="plu" text-anchor="end">D0</text>
    <rect x="300" y="182" width="12" height="9" class="pin"/><text x="294" y="190" class="pl" text-anchor="end">D1</text><text x="320" y="190" class="note">I2C — резерв</text>
    <rect x="300" y="206" width="12" height="9" class="pin"/><text x="294" y="214" class="pl" text-anchor="end">D2</text><text x="320" y="214" class="note">I2C — резерв</text>
    <rect x="300" y="230" width="12" height="9" class="pin"/><text x="294" y="238" class="pl" text-anchor="end">D3</text><text x="320" y="238" class="note">⚠ boot</text>
    <rect x="300" y="254" width="12" height="9" class="pin"/><text x="294" y="262" class="pl" text-anchor="end">D4</text><text x="320" y="262" class="note">LED плати</text>
    <rect x="300" y="278" width="12" height="9" class="pin"/><text x="294" y="286" class="pl" text-anchor="end">3V3</text>
    <rect x="300" y="302" width="12" height="9" class="pinu"/><text x="294" y="310" class="plu" text-anchor="end">GND</text>
    <rect x="300" y="326" width="12" height="9" class="pinu"/><text x="294" y="334" class="plu" text-anchor="end">D5</text>
    <rect x="300" y="350" width="12" height="9" class="pin"/><text x="294" y="358" class="pl" text-anchor="end">D6</text><text x="320" y="358" class="note">кнопка MUTE — майб.</text>
    <rect x="300" y="374" width="12" height="9" class="pin"/><text x="294" y="382" class="pl" text-anchor="end">D7</text><text x="320" y="382" class="note">кнопка TEST — майб.</text>
    <rect x="300" y="398" width="12" height="9" class="pin"/><text x="294" y="406" class="pl" text-anchor="end">D8</text><text x="320" y="406" class="note">⚠ boot</text>
    <rect x="300" y="422" width="12" height="9" class="pin"/><text x="294" y="430" class="pl" text-anchor="end">RX</text>
    <rect x="300" y="446" width="12" height="9" class="pin"/><text x="294" y="454" class="pl" text-anchor="end">TX</text>
    <rect x="300" y="470" width="12" height="9" class="pin"/><text x="294" y="478" class="pl" text-anchor="end">GND</text>
    <rect x="300" y="494" width="12" height="9" class="pin"/><text x="294" y="502" class="pl" text-anchor="end">3V3</text>
  </g>

  <!-- ==================== KY-019 relay ==================== -->
  <rect x="610" y="96" width="270" height="130" class="module" rx="8"/>
  <text x="626" y="120" class="mlb">KY-019 — реле сирени (5 В)</text>
  <rect x="700" y="132" width="120" height="80" fill="#2255a4" rx="4"/>
  <text x="760" y="176" font-size="10" fill="#cfe0f5" text-anchor="middle">SRD-05VDC-SL-C</text>
  <rect x="598" y="138" width="12" height="9" class="pinu"/><text x="626" y="146" class="ml">S — сигнал</text>
  <rect x="598" y="166" width="12" height="9" class="pinu"/><text x="626" y="174" class="ml">+ — 5 В</text>
  <rect x="598" y="194" width="12" height="9" class="pinu"/><text x="626" y="202" class="ml">− — GND</text>
  <!-- screw terminals bottom -->
  <rect x="742" y="220" width="14" height="10" class="pin"/><text x="749" y="246" class="note" text-anchor="middle">COM</text>
  <rect x="790" y="220" width="14" height="10" class="pin"/><text x="797" y="246" class="note" text-anchor="middle">NO</text>
  <rect x="694" y="220" width="14" height="10" class="pin"/><text x="701" y="246" class="note" text-anchor="middle">NC</text>

  <!-- siren (future, via relay contacts) -->
  <rect x="640" y="268" width="240" height="66" fill="none" stroke="#8a94a3" stroke-width="2" stroke-dasharray="7 5" rx="8"/>
  <text x="656" y="292" class="cap" fill="#4a5462">🔊 Сирена + її блок живлення</text>
  <text x="656" y="310" class="warn">підключати ТІЛЬКИ після COMMISSIONING.md</text>
  <text x="656" y="326" class="note">розрив плюса сирени через COM–NO</text>
  <path class="wfut" d="M749 230 L749 268"/>
  <path class="wfut" d="M797 230 L797 268"/>

  <!-- ==================== KY-009 indicator ==================== -->
  <rect x="610" y="380" width="270" height="120" class="module" rx="8"/>
  <text x="626" y="404" class="mlb">KY-009 — індикатор тривоги</text>
  <text x="626" y="422" font-size="11" fill="#cfe0f5">SMD RGB, резистори на платі модуля</text>
  <rect x="598" y="434" width="12" height="9" class="pinu"/><text x="626" y="442" class="ml">R — червоний</text>
  <rect x="598" y="458" width="12" height="9" class="pin"/><text x="626" y="466" class="ml">G, B — не підключені</text>
  <rect x="598" y="482" width="12" height="9" class="pinu"/><text x="626" y="490" class="ml">− — GND</text>

  <!-- ==================== wires ==================== -->
  <!-- D5 -> S (signal, blue): right col y=330 -> x=560 -> y=142 -->
  <path class="wsig" d="M312 330 L560 330 L560 142 L598 142"/>
  <!-- VU (left col y=210) over the top to relay + (y=170) -->
  <path class="w5v" d="M108 210 L76 210 L76 66 L576 66 L576 170 L598 170"/>
  <!-- GND right col y=306 -> junction x=520 -> relay - (y=198) and KY009 - (y=486) -->
  <path class="wgnd" d="M312 306 L520 306 L520 198 L598 198"/>
  <path class="wgnd" d="M520 306 L520 486 L598 486"/>
  <circle cx="520" cy="306" r="4" fill="#222831"/>
  <!-- D0 (y=162) -> x=540 -> KY009 R (y=438) -->
  <path class="wled" d="M312 162 L540 162 L540 438 L598 438"/>

  <!-- ==================== legend ==================== -->
  <g transform="translate(30,556)">
    <line x1="0" y1="0" x2="34" y2="0" class="w5v"/><text x="42" y="4" class="cap">5 В (VU)</text>
    <line x1="130" y1="0" x2="164" y2="0" class="wgnd"/><text x="172" y="4" class="cap">GND</text>
    <line x1="232" y1="0" x2="266" y2="0" class="wsig"/><text x="274" y="4" class="cap">D5 → реле (сирена)</text>
    <line x1="424" y1="0" x2="458" y2="0" class="wled"/><text x="466" y="4" class="cap">D0 → індикатор</text>
    <line x1="606" y1="0" x2="640" y2="0" class="wfut"/><text x="648" y="4" class="cap">майбутнє / після commissioning</text>
  </g>
  <text x="30" y="588" class="note">⚠ D3, D4, D8 — boot-піни: нічого не вішати без розуміння наслідків. Кнопки MUTE/TEST (D6/D7 → GND) і RGB через I2C (D1/D2) — майбутнє розширення.</text>
  <text x="30" y="606" class="note">Клема NC реле вільна. Реле-модуль живиться 5 В від VU; вхід S керується 3.3 В (сумісно). Полярність у прошивці: ACTIVE HIGH.</text>
</svg>
